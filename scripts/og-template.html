<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; overflow:hidden; font-family:'Inter',sans-serif; }
  .stage { width:1200px; height:630px; position:relative;
    background: radial-gradient(120% 120% at 80% 10%, #F8F4ED 0%, #F1EBDF 45%, #E8DFCE 100%); padding:64px 72px; color:#211B15; }
  .dot { position:absolute; inset:0; background-image:radial-gradient(rgba(33,27,21,.10) 1.5px, transparent 1.5px); background-size:30px 30px; }
  .row { position:relative; display:flex; align-items:center; justify-content:space-between; }
  .mark { display:flex; align-items:center; gap:14px; }
  .mbox { width:48px; height:48px; background:#211B15; color:#F8F4ED; display:grid; place-items:center; }
  .brand { font-family:'Fraunces',serif; font-size:34px; font-weight:600; letter-spacing:-.02em; }
  .mono { font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:.2em; font-size:15px; color:#5A5044; }
  .kr { color:#C66E22; }
  h1 { position:relative; font-family:'Fraunces',serif; font-weight:600; font-size:118px; line-height:.9; letter-spacing:-.04em; margin-top:120px; max-width:1000px; }
  .it { font-style:italic; color:#C66E22; }
  .foot { position:absolute; left:72px; right:72px; bottom:60px; display:flex; align-items:center; justify-content:space-between; }
  .pill { font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:.18em; font-size:15px; background:#C66E22; color:#fff; padding:12px 22px; box-shadow:5px 5px 0 #211B15; }
</style></head>
<body>
  <div class="stage">
    <div class="dot"></div>
    <div class="row">
      <div class="mark">
        <svg width="56" height="56" viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="45" fill="none" stroke="#16335C" stroke-width="1" opacity="0.85"/>
          <g fill="#16335C">
            <circle cx="50" cy="5" r="2.6"/><circle cx="81.8" cy="18.2" r="2.6"/><circle cx="95" cy="50" r="2.6"/>
            <circle cx="81.8" cy="81.8" r="2.6"/><circle cx="50" cy="95" r="2.6"/><circle cx="18.2" cy="81.8" r="2.6"/>
            <circle cx="5" cy="50" r="2.6"/><circle cx="18.2" cy="18.2" r="2.6"/>
          </g>
          <path d="M50 20 C61 20 70 29 70 40 C70 49 65 53 61.5 58 L38.5 58 C35 53 30 49 30 40 C30 29 39 20 50 20 Z" fill="#16335C"/>
          <rect x="40" y="59.5" width="20" height="3.6" rx="1.8" fill="#16335C"/>
          <rect x="41" y="64.5" width="18" height="3.6" rx="1.8" fill="#16335C"/>
          <rect x="42" y="69.5" width="16" height="3.6" rx="1.8" fill="#16335C"/>
          <path d="M44.5 74.5 L55.5 74.5 L52 80 L48 80 Z" fill="#16335C"/>
          <g transform="rotate(-13 50 39)" stroke="#F8F4ED" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <path d="M47 28 L41 39 L47 50"/><path d="M53 28 L59 39 L53 50"/>
          </g>
        </svg>
        <div class="brand">WebDev<span class="kr">.</span>NY</div></div>
      <div class="mono">Web Studio · New York</div>
    </div>

    <h1>Websites New York<br>actually <span class="it">clicks with.</span></h1>

    <div class="foot">
      <div class="mono">Design · Development · SEO · Analytics</div>
      <div class="pill">Start a project ↗</div>
    </div>
  </div>
</body></html>
