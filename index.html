    <!-- Self-heal: when a stale cached HTML points to a JS chunk hash that no
         longer exists, the app's module 404s and never mounts (white screen).
         Recovery reloads once with a cache-buster, but is strictly loop-proof:
           - It ONLY reacts to the app's own bundle (same-origin /assets/*.js).
             Third-party scripts (analytics, etc.) can never trigger a reload.
           - A 30s time-throttle (stored across reloads) guarantees at most one
             recovery per 30s, so nothing can rapid-reload the page. -->
    <script>
      (function () {
        function recover() {
          try {
            var now = Date.now();
            var last = +(sessionStorage.getItem('wdny_recover_ts') || 0);
            if (now - last < 30000) return;          // throttle: 1 reload / 30s max
            sessionStorage.setItem('wdny_recover_ts', String(now));
            location.replace(location.pathname + '?v=' + now + location.hash);
          } catch (e) {}
        }
        function isAppBundle(el) {
          return el && el.tagName === 'SCRIPT' && el.src &&
                 el.src.indexOf(location.origin) === 0 && el.src.indexOf('/assets/') !== -1;
        }
        // 1. Immediate: the app's own bundle failed to load (stale chunk 404).
        window.addEventListener('error', function (e) {
          if (isAppBundle(e && e.target)) recover();
        }, true);
        // 2. Fallback: app still hasn't mounted a couple seconds after load.
        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root');
            if (root && root.childElementCount > 0) return;   // mounted — fine
            recover();
          }, 2500);
        });
      })();
    </script>
