    <script>
      try { if (localStorage.getItem('webdevny_theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
    <!-- Self-heal: if a stale cached HTML points to a missing JS chunk, the app
         never mounts. If #root is still empty a few seconds after load, reload
         once with a cache-buster. Deliberately does NOT react to failed
         stylesheet/font/image loads (those must never trigger a reload). -->
    <script>
      (function () {
        window.addEventListener('load', function () {
          setTimeout(function () {
            try {
              var root = document.getElementById('root');
              if (!root || root.childElementCount > 0) return;      // app mounted — fine
              if (sessionStorage.getItem('wdny_recover')) return;    // already tried once
              sessionStorage.setItem('wdny_recover', '1');
              location.replace(location.pathname + '?v=' + Date.now() + location.hash);
            } catch (e) {}
          }, 5000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
